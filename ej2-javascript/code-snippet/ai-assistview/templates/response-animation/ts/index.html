<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 AI AssistView</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TypeScript AI AssistView Control" />
    <meta name="author" content="Syncfusion" />
    <link href="index.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/20.3.56/ej2-base/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/20.3.56/ej2-interactive-chat/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/20.3.56/ej2-inputs/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/20.3.56/ej2-buttons/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/20.3.56/ej2-navigations/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/20.3.56/ej2-notifications/styles/tailwind3.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/systemjs/0.19.38/system.js"></script>
    <script src="https://cdn.syncfusion.com/ej2/20.4.38/dist/ej2.min.js" type="text/javascript"></script>
    <script src="systemjs.config.js"></script>
    <style>
        .assistview-loading-status {
            display: flex;
            gap: 10px;
            color: #666;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
        }

        .assistview-grid-icon {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .assistview-grid-icon span {
            width: 4px;
            height: 4px;
            background: #8a8a8a;
            border-radius: 1px;
            opacity: 0.25;
            animation: assistview-pulse 1.8s ease-in-out infinite;
        }

        .assistview-grid-icon span:nth-child(1) { animation-delay: 0s; }
        .assistview-grid-icon span:nth-child(2) { animation-delay: 0.1s; }
        .assistview-grid-icon span:nth-child(3) { animation-delay: 0.2s; }
        .assistview-grid-icon span:nth-child(4) { animation-delay: 0.3s; }
        .assistview-grid-icon span:nth-child(5) { animation-delay: 0.4s; }
        .assistview-grid-icon span:nth-child(6) { animation-delay: 0.5s; }
        .assistview-grid-icon span:nth-child(7) { animation-delay: 0.6s; }
        .assistview-grid-icon span:nth-child(8) { animation-delay: 0.7s; }
        .assistview-grid-icon span:nth-child(9) { animation-delay: 0.8s; }

        @keyframes assistview-pulse {
            0%,
            100% {
                opacity: 0.25;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id='loader'>Loading....</div>
    <div id='container' style="height: 350px; width: 650px;">
        <div id="response-animation"></div>
    </div>
</body>
</html>
