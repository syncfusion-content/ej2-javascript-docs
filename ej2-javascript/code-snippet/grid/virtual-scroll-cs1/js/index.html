<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 Grid - Virtual Scroll Mode</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript Grid Control with Virtual Scroll">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/material3.css" rel="stylesheet" />
    <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js" type="text/javascript"></script>
</head>

<body>
    <div id="container">
        <script type="text/x-jsrender" id="employeeIDTemplate">
            ${employeeIDDetail(data)}
        </script>

        <script type="text/x-jsrender" id="employeeNameTemplate">
            ${employeeNameDetail(data)}
        </script>

        <script type="text/x-jsrender" id="designationTemplate">
            ${designationDetail(data)}
        </script>

        <script type="text/x-jsrender" id="locationTemplate">
            ${locationDetail(data)}
        </script>
        
        <div id='Grid'></div>
    </div>

    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
