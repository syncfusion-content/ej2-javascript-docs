<!DOCTYPE html>
<html lang="en">

<head>
    <title>Essential JS 2</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Essential JS 2">
    <meta name="author" content="Syncfusion">
    <link href="https://unpkg.com/@syncfusion/ej2-bootstrap5.3-theme/styles/image-editor/index.css" rel="stylesheet" />
    <style>
        .button-group {
            margin-top: 10px;
        }
    </style>
    <!--system js reference and configuration-->
    <script src="https://cdn.syncfusion.com/ej2/20.4.38/dist/ej2.min.js" type="text/javascript"></script>
</head>

<body>

    <div id="container">
        <div class="control-section">
            <div class="control">
                <div id="imageEditor"></div>
            </div>
            <div class="button-group">
                <button id="contains" class="e-btn e-primary">Fit to Width (Aspect Ratio)</button>
                <button id="cover" class="e-btn e-primary">Cover (Aspect Ratio)</button>
                <button id="stretch" class="e-btn e-primary">Stretch / Shrink</button>
            </div>
        </div>
    </div>

    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
