<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Essential JS 2 Message control</title>

    <link href="https://cdn.syncfusion.com/ej2/34.2.2/fluent2.css" rel="stylesheet">

    <!-- Essential JS 2 Base's global script (Dependency Script) -->
    <script src="https://cdn.syncfusion.com/ej2/ej2-base/dist/global/ej2-base.min.js" type="text/javascript"></script>

    <!-- Essential JS 2 Message global script (Control Script) -->
    <script src="https://cdn.syncfusion.com/ej2/ej2-notifications/dist/global/ej2-notifications.min.js"
        type="text/javascript"></script>

</head>

<body>
    <!--Element which will render as Message-->
    <div class="msg-default">
        <div id="msg"></div>
    </div>

    <script>
        var msgObj = new ej.notifications.Message({
            content: "Please read the comments carefully"
        });
        msgObj.appendTo("#msg");
    </script>
    
    <style>
        /* Sample level styles */
        .msg-default .e-message {
            margin: 100px;
        }
    </style>
</body>
</html>
