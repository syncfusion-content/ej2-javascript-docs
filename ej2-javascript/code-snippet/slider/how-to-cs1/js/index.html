<!DOCTYPE html>
<html lang="en">

<head>
    <title>Essential JS 2 Range Slider</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Essential JS 2 Range Slider Control">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/34.2.2/fluent2.css" rel="stylesheet">
    <script src="https://cdn.syncfusion.com/ej2/20.4.38/dist/ej2.min.js" type="text/javascript"></script>
</head>

<body>
    <div id="container">

        <div class="wrap">
            <div class="label">Slider formatted with unit representation</div>
            <div id="slider">
            </div>
        </div>

        <div class="wrap">
            <div class="label">Slider formatted with three decimal specifiers</div>
            <div id="slider1">
            </div>
        </div>

        <div class="wrap">
            <div class="label">Slider formatted with two leading zeros</div>
            <div id="slider2">
            </div>
        </div>
    </div>

    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
    <style>
        .wrap {
            box-sizing: border-box;
            height: 100px;
            margin: 0 auto;
            padding: 30px 10px;
            width: 460px;
        }

        .wrap .label {
            text-align: center;
        }
    </style>
</body>

</html>
