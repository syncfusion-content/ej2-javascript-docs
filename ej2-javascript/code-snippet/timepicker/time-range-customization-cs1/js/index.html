<!DOCTYPE html><html lang="en"><head>
    <title>Essential JS 2 TimePicker control</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Typescript UI Controls">
    <meta name="author" content="Syncfusion">
    <!--style reference from the TimePicker component-->
    <link href="https://cdn.syncfusion.com/ej2/34.2.2/fluent2.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet">
    
    
<script src="https://cdn.syncfusion.com/ej2/20.4.38/dist/ej2.min.js" type="text/javascript"></script>
</head>

<body>
    
    <div id="container">
        <div class="pane">
            <div class="tabs-wrap">
                <div class="wrap">
                    <input type="text" id="start">
                </div>
            </div>
            <div class="tabs-wrap" style="clear: both">
                <div class="wrap">
                    <input type="text" id="end">
                </div>
            </div>
            <div class="tabs-wrap" style="clear: both;padding: 14px 10px;">
                <div class="wrap">
                    <input type="checkbox" id="dayRange">
                </div>
            </div>
        </div>
    </div>


<script>
var ele = document.getElementById('container');
if(ele) {
  ele.style.visibility = "visible";
}   
      </script>
<script src="index.js" type="text/javascript"></script>
</body></html>
