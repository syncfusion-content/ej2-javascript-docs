<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>Essential JS 2 Tooltip</title>
    <link href="https://cdn.syncfusion.com/ej2/34.2.2/fluent2.css" rel="stylesheet">
    <!-- Essential JS 2 Tooltip's global script -->
    <script src="//cdn.syncfusion.com/ej2/21.2.3/dist/ej2.min.js" type="text/javascript"></script>
</head>

<body>
    <!-- Add the HTML span element  -->
    <div id='container'>
        <div style="display: inline-block; position: relative; left: 50%;top: 100px;transform: translateX(-50%);">
            <span id='target'></span>
        </div>
    </div>
    <script>
        //Initialize Essential JS 2 JavaScript Tooltip component
        var tooltip = new ej.popups.Tooltip({
            width: '150px',
            height: '40px',
            content: 'Tooltip with specific width and height'
        });
        tooltip.appendTo('#target');

        var button = new ej.buttons.Button({
            content: 'Show Tooltip'
        });
        button.appendTo('#target');
    </script>
</body>

</html>
